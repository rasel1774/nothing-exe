
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTHING.EXE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(ellipse,#350000,#050505 70%);
 color:white;font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 text-align:center;overflow:hidden;
}
.container{width:90%;max-width:430px;padding:25px 0}
.tag{color:#ff4444;letter-spacing:5px;font-size:11px}
h1{font-size:clamp(32px,9vw,48px);color:red;
 text-shadow:0 0 25px red;letter-spacing:2px}
p{color:#999}
.stage{height:100px;position:relative;margin-top:35px}
button{
 background:#c00020;color:white;border:1px solid red;
 padding:19px 23px;border-radius:7px;
 font-weight:bold;letter-spacing:2px;
 box-shadow:0 0 20px red;font-size:14px;
}
#btn{position:absolute;left:50%;transform:translateX(-50%);
 white-space:nowrap}
#message{color:#ff4444;min-height:40px;margin:15px 0}
#counter{color:#666;font-size:12px}
#hack,#secret{display:none;margin-top:20px}
#hack{color:#ff3333;font-size:12px;line-height:2}
#secret{border:1px solid red;padding:20px;border-radius:10px}
.glitch{animation:shake .12s infinite}
@keyframes shake{
 0%{transform:translate(2px)}
 50%{transform:translate(-3px,2px)}
 100%{transform:translate(0)}
}
</style>
</head>
<body>
<div class="container" id="main">
 <div class="tag">SYSTEM STATUS: ONLINE</div>
 <h1>NOTHING.EXE</h1>
 <p>There is absolutely nothing here.</p>
 <p>Seriously. Don't click.</p>

 <div class="stage">
  <button id="btn" onclick="clickMe()">DON'T CLICK ME</button>
 </div>

 <div id="message">I'm warning you.</div>
 <div id="hack"></div>
 <div id="secret"></div>
 <div id="counter">CLICK COUNT: 000</div>
</div>

<script>
let clicks=0;
const btn=document.getElementById("btn");
const msg=document.getElementById("message");

const messages=[
"I TOLD YOU NOT TO CLICK!",
"You're really persistent.",
"STOP TOUCHING ME!",
"Why are you like this?",
"ERROR: Common sense not found.",
"Your curiosity is dangerous.",
"Something is not right...",
"PLEASE STOP.",
"FINAL WARNING.",
"YOU FOUND THE SECRET!"
];

function clickMe(){
 clicks++;
 document.getElementById("counter").innerText=
 "CLICK COUNT: "+String(clicks).padStart(3,"0");

 msg.innerText=messages[Math.min(clicks-1,9)];

 if(clicks===3){
  document.body.classList.add("glitch");
  setTimeout(()=>document.body.classList.remove("glitch"),1000);
 }

 if(clicks===5){
  let hack=document.getElementById("hack");
  hack.style.display="block";
  hack.innerHTML="CONNECTING TO SERVER...<br>ACCESS DENIED...<br>JUST KIDDING 😂";
 }

 if(clicks>=2 && clicks<10){
  btn.style.left=(10+Math.random()*65)+"%";
  btn.style.transform="none";
 }

 if(clicks===10){
  document.getElementById("secret").style.display="block";
  document.getElementById("secret").innerHTML=
  "🔓 SECRET LEVEL 1 UNLOCKED<br><br>"+
  "WELCOME TO THE NOTHING CLUB.<br><br>"+
  "<button onclick='secretTwo()'>ENTER LEVEL 2</button>";
 }

 if(clicks>10) btn.innerText="CLICK AGAIN?";
}

function secretTwo(){
 document.getElementById("secret").innerHTML=
 "☠️ SECRET LEVEL 2<br><br>"+
 "YOU FOUND THE PLACE THAT DOESN'T EXIST.<br><br>"+
 "<button onclick='finalLevel()'>WHAT'S NEXT?</button>";
}

function finalLevel(){
 document.getElementById("main").innerHTML=
 "<div class='tag'>UNKNOWN SYSTEM</div>"+
 "<h1>YOU WON?</h1>"+
 "<p>Congratulations!</p>"+
 "<p>You spent your time clicking NOTHING.</p>"+
 "<h2 style='color:red'>NOTHING.EXE</h2>"+
 "<p>There is no prize. 😂</p>";
}
</script>
</body>
</html>
